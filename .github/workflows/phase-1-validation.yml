name: Phase 1 Tier 2 DNS Validation & Security Gate

on:
  push:
    branches:
      - phase-1-validation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-secret-scan:
    name: Static Audit, Secret Scan & Misconfig Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Phase 0 link and secret pattern checks
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".").resolve()
          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          secret_pats = [
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              re.compile(r"\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
          ]
          for path in sorted(root.rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for pat in secret_pats:
                  if pat.search(text):
                      print(f"ERROR: Secret pattern found in {path}", file=sys.stderr)
                      sys.exit(1)
              if path.suffix.lower() == ".md":
                  for m in link_re.finditer(text):
                      t = m.group(1).strip()
                      if not t or t.startswith("#") or "://" in t or t.startswith("mailto:"):
                          continue
                      if not (path.parent / t.split("#", 1)[0]).resolve().exists():
                          print(f"ERROR: Broken link in {path}: {t}", file=sys.stderr)
                          sys.exit(1)
          print("Static link & secret pattern checks passed.")
          PY

      - name: Validate shell script syntax
        run: |
          set -euo pipefail
          for f in infrastructure/dns-tier2/scripts/*.sh; do
            bash -n "$f"
          done

      - name: Run Phase 1 static hardening & live OpenNIC upstream audit
        run: |
          python3 -m pip install --quiet pyyaml
          python3 infrastructure/dns-tier2/scripts/test-local-audit.py

      - name: Trivy filesystem secret and vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Trivy filesystem misconfiguration audit
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM

  runtime-and-security-validation:
    name: Linux BIND9 Container Runtime Validation
    runs-on: ubuntu-latest
    needs: static-and-secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify host loopback port 53 availability
        run: |
          ss -tulnp || true

      - name: Build Phase 1 BIND9 container image
        working-directory: infrastructure/dns-tier2
        run: |
          docker compose config >/dev/null
          docker compose build

      - name: Trivy container image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: balkan-open-dns/bind9-tier2:1.0.0
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM

      - name: Start isolated loopback BIND9 container and wait for health
        working-directory: infrastructure/dns-tier2
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' balkan-dns-tier2 || echo starting)"
            if [[ "$status" == "healthy" ]]; then
              echo "Container healthy after ${i} checks"
              break
            fi
            sleep 2
          done
          if [[ "$status" != "healthy" ]]; then
            docker compose logs --tail=50
            exit 1
          fi
          docker port balkan-dns-tier2
          docker stats --no-stream balkan-dns-tier2

      - name: Run full Phase 1 runtime validation suite
        run: |
          python3 infrastructure/dns-tier2/scripts/ci-validate-runtime.py

      - name: Collect container diagnostics & teardown
        if: always()
        working-directory: infrastructure/dns-tier2
        run: |
          echo "=== named-ops.log ==="
          docker exec balkan-dns-tier2 cat /var/log/named/named-ops.log 2>/dev/null || true
          echo "=== named-security.log ==="
          docker exec balkan-dns-tier2 cat /var/log/named/named-security.log 2>/dev/null || true
          echo "=== docker compose logs ==="
          docker compose logs --tail=80 || true
          docker compose down -v || true
