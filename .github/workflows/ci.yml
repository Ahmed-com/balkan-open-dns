name: Phase 0 Foundation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-checks:
    name: Repository Hygiene & Documentation Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required foundation files exist
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "LICENSE"
            "SECURITY.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            ".gitignore"
            "docs/architecture.md"
            "docs/opennic-requirements.md"
            "docs/threat-model.md"
            "docs/roadmap.md"
            "docs/infrastructure-plan.md"
            ".github/workflows/ci.yml"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: Missing or empty required file: $file"
              exit 1
            fi
          done
          echo "All ${#required_files[@]} required Phase 0 files exist and are non-empty."

      - name: Validate relative markdown links and scan for secrets
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".").resolve()
          errors = []

          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          secret_patterns = [
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              re.compile(r"\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
          ]

          for path in sorted(root.rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for pat in secret_patterns:
                  if pat.search(text):
                      errors.append(f"Potential secret pattern in {path.relative_to(root)}")

              if path.suffix.lower() == ".md":
                  for match in link_re.finditer(text):
                      target = match.group(1).strip()
                      if (
                          not target
                          or target.startswith("#")
                          or "://" in target
                          or target.startswith("mailto:")
                      ):
                          continue
                      rel_target = target.split("#", 1)[0]
                      resolved = (path.parent / rel_target).resolve()
                      if not resolved.exists():
                          errors.append(
                              f"Broken relative link in {path.relative_to(root)}: {target}"
                          )

          if errors:
              for err in errors:
                  print("ERROR:", err, file=sys.stderr)
              sys.exit(1)

          print("Relative markdown link checks and secret pattern scan passed.")
          PY
